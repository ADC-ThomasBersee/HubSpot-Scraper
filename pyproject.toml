[project]
name = "hubspot-deal-extract"
version = "0.1.0"
description = "Extract HubSpot deals and load to BigQuery"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-auth>=2.49.2",
    "google-cloud-bigquery>=3.41.0",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
]

[project.scripts]
hubspot-extract = "hubspot:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hubspot.py"]
